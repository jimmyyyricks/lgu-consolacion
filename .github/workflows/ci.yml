name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the release to production after checks pass
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lgu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lgu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lgu_test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/lgu_test
      DATABASE_BOOTSTRAP_URL: postgresql://postgres:postgres@localhost:5432/postgres
      EAM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lgu_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Generate isolated test administrator password
        run: |
          echo "EAM_TEST_ADMIN_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Initialize test database
        working-directory: backend
        run: |
          python scripts/setup_system.py --all \
            --admin-username Administrator \
            --admin-email ci-admin@example.invalid \
            --admin-full-name "CI Test Administrator" \
            --admin-password "$EAM_TEST_ADMIN_PASSWORD"

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm typecheck

      - name: Run unit tests
        working-directory: frontend
        run: pnpm test

      - name: Build and package release
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_URL: /api
        run: |
          pnpm build
          mkdir -p bundle/frontend bundle/backend
          cp -a .output bundle/frontend/.output
          cp -a ../backend/app ../backend/alembic ../backend/alembic.ini ../backend/requirements.txt bundle/backend/
          tar -C bundle -czf lgu-release.tar.gz .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgu-release
          path: frontend/lgu-release.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: lgu-production-deploy
      cancel-in-progress: false
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: lgu-release

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Transfer and activate release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_FRONTEND_SERVICE: ${{ vars.DEPLOY_FRONTEND_SERVICE }}
          DEPLOY_BACKEND_SERVICE: ${{ vars.DEPLOY_BACKEND_SERVICE }}
          FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL || 'http://127.0.0.1:3010/' }}
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL || 'http://127.0.0.1:8010/health' }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_FRONTEND_SERVICE DEPLOY_BACKEND_SERVICE; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub production variable: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_PATH" =~ ^/[[:alnum:]_./-]+$ || "$DEPLOY_PATH" == *".."* ]]; then
            echo "DEPLOY_PATH must be an absolute path containing only letters, numbers, '/', '.', '_' and '-'." >&2
            exit 1
          fi

          ssh_options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT")
          printf -v remote_mkdir 'mkdir -p %q %q %q' \
            "$DEPLOY_PATH/incoming" "$DEPLOY_PATH/releases" "$DEPLOY_PATH/shared"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_mkdir"
          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            lgu-release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/incoming/$GITHUB_SHA.tar.gz"

          printf -v remote_command \
            'DEPLOY_ROOT=%q RELEASE_ID=%q FRONTEND_SERVICE=%q BACKEND_SERVICE=%q FRONTEND_HEALTH_URL=%q BACKEND_HEALTH_URL=%q bash -s' \
            "$DEPLOY_PATH" "$GITHUB_SHA" "$DEPLOY_FRONTEND_SERVICE" \
            "$DEPLOY_BACKEND_SERVICE" "$FRONTEND_HEALTH_URL" "$BACKEND_HEALTH_URL"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" \
            < deploy/activate-release.sh
